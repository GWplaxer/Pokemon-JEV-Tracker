    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }

                <p class="text-slate-400 mt-2">Live Automated Portfolio & Product Efficiency Ranking Matrix</p>
            </div>
            <div class="text-right">
                <span class="px-3 py-1 bg-indigo-950 text-indigo-400 border border-indigo-800 rounded-full text-xs font-semibold uppercase tracking-wider">Historical Average JEV: 0.0510</span>
            </div>
        </header>

        <div class="overflow-x-auto bg-slate-900 border border-slate-800 rounded-xl shadow-xl">

                <thead>
                    <tr class="bg-slate-950 border-b border-slate-800 text-slate-300 font-semibold text-xs tracking-wider uppercase">

                        <th class="p-4">Expansion Set</th>
                        <th class="p-4">Optimal Packaging Form</th>
                        <th class="p-4 text-right">Sealed Entry Cost</th>
                        <th class="p-4 text-right">Avg Top 3 Chase Value</th>
                        <th class="p-4 text-right">Combined Hit Rate %</th>
                        <th class="p-4 text-right">Jackpot EV Coefficient</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body" class="divide-y divide-slate-800 text-sm">
                    <!-- Javascript or backend writes list items here dynamically -->

            </table>
        </div>
    </div>

        setsData.sort((a, b) => b.jev - a.jev);

        const tbody = document.getElementById('leaderboard-body');
        setsData.forEach((set, index) => {
            const tr = document.createElement('tr');
            tr.className = index % 2 === 0 ? 'bg-slate-900/50 hover:bg-slate-800/40 transition' : 'hover:bg-slate-800/40 transition';

                <td class="p-4 text-slate-400 text-xs">${set.format}</td>
                <td class="p-4 text-right text-slate-300 font-mono">$${set.price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td class="p-4 text-right text-slate-300 font-mono">$${set.chase.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>

            tbody.appendChild(tr);
